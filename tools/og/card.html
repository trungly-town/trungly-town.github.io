<!doctype html>
<!--
  Link-preview card (1200×630) used by tools/build-pages.mjs — it screenshots this page with headless Chrome.
  Query parameters: kind (home | blog | post | project), title, kicker, sub, chips (separated by "|").
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&family=Caveat:wght@700&display=block" rel="stylesheet">
  <style>
    :root {
      --bg: #04121a; --text: #e8ebf4; --text-2: #b6bfd2; --muted: #8a95ab;
      --c1: #38bdf8; --c2: #2dd4bf; --c3: #a3e635;
      --grad: linear-gradient(110deg, var(--c1) 0%, var(--c2) 55%, var(--c3) 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }

    .card { position: relative; isolation: isolate; width: 1200px; height: 630px; padding: 52px 64px 58px; display: flex; flex-direction: column; overflow: hidden; }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background-image: linear-gradient(rgba(148,163,184,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.07) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 30% 20%, #000 20%, transparent 80%);
    }
    .blob { position: absolute; z-index: -2; border-radius: 50%; }
    .b1 { right: -180px; top: -240px; width: 680px; height: 680px; background: radial-gradient(circle, rgba(45,212,191,.32), transparent 66%); }
    .b2 { left: -260px; bottom: -320px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(56,189,248,.26), transparent 66%); }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--grad); }

    .top { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 14px; font: 600 27px "Space Grotesk"; }
    .brand i { color: var(--c2); font-style: normal; }
    .mark { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: var(--grad); color: #032229; font: 700 20px "Space Grotesk"; }
    .kicker {
      font: 500 17px "JetBrains Mono"; letter-spacing: .12em; text-transform: uppercase; color: var(--c1);
      padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(45,212,191,.35); background: rgba(45,212,191,.08);
    }

    .main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    h1 { font: 700 64px/1.08 "Space Grotesk"; letter-spacing: -.03em; max-width: 1040px; }
    .sub {
      margin-top: 22px; max-width: 980px; font-size: 26px; line-height: 1.45; color: var(--text-2);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .chip { padding: 9px 16px; border-radius: 12px; font: 500 19px Inter; color: var(--text-2); border: 1px solid rgba(148,163,184,.24); background: rgba(148,163,184,.07); }
    .chip b { font-weight: 700; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .foot { display: flex; align-items: center; justify-content: space-between; }
    .author { display: flex; align-items: center; gap: 16px; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(148,163,184,.4); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.5); transform-origin: 50% 22%; }
    .who b { display: block; font: 600 22px Inter; }
    .who span { font-size: 18px; color: var(--muted); }
    .domain { font: 500 18px "JetBrains Mono"; color: var(--muted); }

    /* home: name + portrait */
    .home .main { flex-direction: row; align-items: center; justify-content: space-between; gap: 48px; }
    .home .hello { font: 500 30px "Space Grotesk"; color: var(--text-2); }
    .home h1 { font-size: 82px; margin-top: 4px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .home .aka { font: 700 34px Caveat; color: var(--text-2); margin-top: 2px; }
    .home .aka b { color: var(--c3); }
    .home .role { margin-top: 18px; font: 500 25px Inter; color: var(--text); }
    .portrait { position: relative; flex: none; width: 300px; height: 300px; }
    .portrait::before { content: ""; position: absolute; inset: -4px; border-radius: 40px; background: conic-gradient(from 200deg, var(--c1), var(--c2), var(--c3), var(--c1)); }
    .portrait::after { content: ""; position: absolute; inset: 10%; z-index: -1; border-radius: 40px; background: var(--c2); filter: blur(60px); opacity: .45; }
    .portrait div { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 36px; border: 6px solid var(--bg); }
    .portrait img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.3); transform-origin: 50% 8%; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="blob b1"></div><div class="blob b2"></div><div class="bar"></div>
    <div class="top">
      <div class="brand"><span class="mark">TL</span><span>trung<i>.</i>ly</span></div>
      <span class="kicker" id="kicker"></span>
    </div>
    <div class="main" id="main"></div>
    <div class="foot" id="foot">
      <div class="author">
        <span class="avatar"><img src="../../assets/img/avatar.png" alt=""></span>
        <div class="who"><b>Ly Minh Trung (Philip)</b><span>Senior Data Scientist (AI)</span></div>
      </div>
      <span class="domain">trungly-town.github.io</span>
    </div>
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const kind = q.get('kind') || 'post';
    const chips = (q.get('chips') || '').split('|').filter(Boolean)
      // "**2,000+** agents" → bold, gradient number
      .map((c) => `<span class="chip">${esc(c).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</span>`).join('');
    const card = document.getElementById('card');
    const main = document.getElementById('main');
    document.getElementById('kicker').textContent = q.get('kicker') || '';

    if (kind === 'home') {
      card.classList.add('home');
      document.getElementById('foot').querySelector('.author').style.visibility = 'hidden';
      main.innerHTML = `
        <div>
          <p class="hello">Hi, I'm</p>
          <h1>Ly Minh Trung</h1>
          <p class="aka">just call me <b>Philip</b></p>
          <p class="role">${esc(q.get('sub') || '')}</p>
          <div class="chips">${chips}</div>
        </div>
        <div class="portrait"><div><img src="../../assets/img/avatar.png" alt=""></div></div>`;
    } else {
      main.innerHTML = `
        <h1 id="title">${esc(q.get('title') || '')}</h1>
        ${q.get('sub') ? `<p class="sub">${esc(q.get('sub'))}</p>` : ''}
        ${chips ? `<div class="chips">${chips}</div>` : ''}`;
      // shrink long titles until they fit in three lines
      const h1 = document.getElementById('title');
      document.fonts.ready.then(() => {
        for (let size = 64; size > 40; size -= 2) {
          h1.style.fontSize = `${size}px`;
          if (h1.scrollHeight <= size * 1.08 * 3 + 2) break;
        }
      });
    }
  </script>
</body>
</html>
